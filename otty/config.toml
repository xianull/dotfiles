# Otty config — ~/.config/otty/config.toml
# Docs: https://docs.otty.sh/reference/configuration
# Hot-reloads on save (most keys). Opacity changes need a new window.

# ── Font (aligned with Ghostty) ──────────────────────────────────────
font-family = "Maple Mono CN"
font-family-fallback = ["Hack Nerd Font, JetBrains Mono, Menlo"]
font-size = 16

# UI chrome (sidebar / tabs / settings) — same family as terminal
# ui-font-family = "Maple Mono CN" (reset to default)
# ui-font-size = 16 (reset to default)

# ── Themes ───────────────────────────────────────────────────────────
# Light / dark slots. With auto-theme-dark-mode, Otty follows macOS appearance.
# Built-ins: Paper, Nord, Gruvbox Dark, Tokyo Night, Catppuccin Mocha, Dracula, …
# Switch: Settings → Appearance, Cmd palette "Theme", or `otty theme set <name>`
theme = "Gruvbox Dark"
theme-dark = "Gruvbox Dark"

# ── Window ───────────────────────────────────────────────────────────
# background-opacity = 0.90   # 0.5–1.0; needs reopen to apply
# window-layout = "sidebar-left"   # sidebar-left | tabs-top | tabs-bottom

# ── macOS ────────────────────────────────────────────────────────────
macos-option-as-alt = true

# ── Shell ────────────────────────────────────────────────────────────
# command = "/bin/zsh"
# working-directory = "home"   # inherit | home | absolute path
# shell-integration = true (reset to default)

# ── Session ──────────────────────────────────────────────────────────
# on-launch = "restore_session"   # restore_session | new_window
# scrollback-lines = 10000 (reset to default)

# window-layout = "tabs-top" (reset to default)
foreground = "#ebdbb2"
background = "#282828"
palette-0 = "#282828"















new-tab-position = "end"

font-ligatures = "calt"


# cursor-opacity = 0.99 (reset to default)

cursor-animation = "smooth"

autocomplete-shortcut = "tab+right-arrow"





sidebar-width = 221

language = "chinese"




# font-blending = "linear" (reset to default)
# selection-foreground = "#9e8b13" (reset to default)
# selection-background = "#ffffff" (reset to default)
# cursor-color = "#57647a" (reset to default)
# cursor-text = "#323232" (reset to default)


palette-1 = "#cc241d"
palette-2 = "#98971a"
palette-3 = "#d79921"
palette-4 = "#458588"
palette-5 = "#b16286"
palette-6 = "#689d6a"
palette-7 = "#a89984"
palette-8 = "#928374"
palette-9 = "#fb4934"
palette-10 = "#b8bb26"
palette-11 = "#fabd2f"
palette-12 = "#83a598"
palette-13 = "#d3869b"
palette-14 = "#8ec07c"


# text-blink = true (reset to default)

cursor-style = "bar"

auto-theme-dark-mode = false

palette-15 = "#ebdbb2"
